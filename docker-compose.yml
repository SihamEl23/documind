# Base PostgreSQL + pgvector pour le développement local.
# Lancer : docker compose up -d
# (Alternative sans Docker : une base gratuite Supabase ou Neon, voir README)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
